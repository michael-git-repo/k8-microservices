name: Products service CI/CD
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'security/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: products-service-${{ github.ref }}
  cancel-in-progress: false
env:
  DOCKER_IMAGE: bleosas/products-service
jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test API and persistence
        run: npm run test:coverage
        working-directory: app
      - name: Test deployment image updates
        run: node --test scripts/update-image.test.mjs
      - name: Build container
        run: docker build --pull -t products-service:ci ./app
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: products-service:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          trivyignores: security/.trivyignore
      - name: Save the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save products-service:ci -o image.tar
      - name: Pass the tested image to the publishing job
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: products-image-${{ github.sha }}
          path: image.tar
          retention-days: 1
          compression-level: 0

  publish-and-update:
    needs: test-build-scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          test "$DOCKERHUB_USERNAME" = "bleosas" || { echo 'Set USERNAME to the Docker Hub account bleosas.'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set the DOCKER_TOKEN repository secret.'; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: products-image-${{ github.sha }}
      - name: Load the tested image
        run: docker load -i image.tar
      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Publish an image tagged with the source commit
        run: |
          image="${DOCKER_IMAGE}:sha-${GITHUB_SHA}"
          docker tag products-service:ci "$image"
          docker push "$image"
          reference="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          printf 'IMAGE_REFERENCE=%s\n' "$reference" >> "$GITHUB_ENV"
      - name: Update the deployment manifest for Argo CD
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'A newer commit exists on main; leaving deployment to the newer workflow.'
            exit 0
          fi
          node scripts/update-image.mjs "$IMAGE_REFERENCE"
          if git diff --quiet -- k8s/deployment.yaml; then
            echo 'The deployment already references this image.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k8s/deployment.yaml
          git commit -m "Deploy products-service from ${GITHUB_SHA}"
          git push origin HEAD:main
