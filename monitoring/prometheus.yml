# Example for a Prometheus server running inside the same Kubernetes namespace.
# Mount both this file and prometheus-rules.yaml in the configuration directory.
global:
  scrape_interval: 15s
rule_files:
  - prometheus-rules.yaml
scrape_configs:
  - job_name: products-service
    metrics_path: /metrics
    static_configs:
      - targets: ['products-service:80']
